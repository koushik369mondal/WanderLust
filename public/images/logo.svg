<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Bezel -->
  <circle cx="32" cy="32" r="28" stroke="#ff7d0c" stroke-width="3.5" fill="none"/>
  <!-- Cardinal Tick Marks -->
  <line x1="32" y1="5" x2="32" y2="11" stroke="#ff7d0c" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="53" x2="32" y2="59" stroke="#ff7d0c" stroke-width="3" stroke-linecap="round"/>
  <line x1="5" y1="32" x2="11" y2="32" stroke="#ff7d0c" stroke-width="3" stroke-linecap="round"/>
  <line x1="53" y1="32" x2="59" y2="32" stroke="#ff7d0c" stroke-width="3" stroke-linecap="round"/>
  <!-- Inner Compass Track -->
  <circle cx="32" cy="32" r="22.5" stroke="#ff7d0c" stroke-width="1.2" stroke-dasharray="2.5 3" opacity="0.6"/>
  <!-- Needle: North (Vibrant Brand Orange) -->
  <polygon points="32,13 37,32 32,28.5" fill="#ff7d0c"/>
  <polygon points="32,13 27,32 32,28.5" fill="#ffa14a"/>
  <!-- Needle: South (Subtle Slate/Silver) -->
  <polygon points="32,51 37,32 32,35.5" fill="#64748b"/>
  <polygon points="32,51 27,32 32,35.5" fill="#94a3b8"/>
  <!-- Center Pivot -->
  <circle cx="32" cy="32" r="3.5" fill="#ff7d0c"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
